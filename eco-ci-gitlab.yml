# DEPRECATED: This version of Eco CI is no longer supported.
# The job templates below only print a deprecation notice so that existing pipelines keep working.

.eco_ci_deprecation_notice: &eco_ci_deprecation_notice
    - |
        echo "WARNING: This version of Eco CI (green-coding-solutions/eco-ci-energy-estimation) is deprecated and no longer measures anything."
        echo "WARNING: Please upgrade to the latest major version. See https://github.com/green-coding-solutions/eco-ci-energy-estimation"

.initialize_energy_estimator:
    script:
        - *eco_ci_deprecation_notice

.start_measurement:
    script:
        - *eco_ci_deprecation_notice

.get_measurement:
    script:
        - *eco_ci_deprecation_notice

.display_results:
    script:
        - *eco_ci_deprecation_notice
