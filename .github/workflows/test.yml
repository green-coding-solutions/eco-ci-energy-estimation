name: Test PR & Periodic

on:
  pull_request:
    paths-ignore:
     - 'README.md'
     - 'LICENSE'
     - '.gitlab-ci.yml.example'
     - '.gitignore'
  schedule:
    # only run once a week to show the action is working and preserve as much energy as possible
    # Reason being that we pull our ML model and this could have changed in the meantime
    - cron: '22 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  test-action:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-14]

    steps:
      - name: Install dependencies (macos only)
        if: ${{ contains(matrix.os, 'macos') }}
        run: |
          brew install coreutils
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin:/usr/local/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      - uses: actions/checkout@v7
        with:
          path: .

      - name: API Base Debug
        run: |
          echo "Current API Base is" ${{ github.api_url }}

      - name: Initialize Energy Estimation (Linux)
        if: ${{ !contains(matrix.os, 'macos') }}
        uses: ./
        with:
          task: start-measurement
          project: "Eco CI"
          machine: ${{ matrix.os }}
          tags: "CI/CD,Test PR & Periodic-Workflow"
          gmt-api-token: ${{ secrets.GMT_API_TOKEN }}
          co2-calculation-method: "constant"
          co2-grid-intensity-constant: 472

      - name: Initialize Energy Estimation (macos-14)
        if: ${{ contains(matrix.os, 'macos-14') }}
        uses: ./
        with:
          task: start-measurement
          project: "Eco CI"
          machine: ${{ matrix.os }}
          tags: "CI/CD,Test PR & Periodic-Workflow"
          gmt-api-token: ${{ secrets.GMT_API_TOKEN }}
          co2-calculation-method: "constant"
          co2-grid-intensity-constant: 472
          machine-power-data: "macos-14-mac-mini-m1.sh"

      - name: working step
        continue-on-error: true
        run: |
          timeout 2s ls -alhR / || true

      - name: 'Dump Raw Measurement Data'
        uses: ./.github/actions/dump-raw-measurement-data

      - name: Eco CI Measurement - echo Hellos; Shell
        uses: ./
        with:
          task: get-measurement
          label: "echo Hellos; $SHELL; \""

      - name: 'Dump Raw Measurement Data'
        uses: ./.github/actions/dump-raw-measurement-data

      - name: Sleep 3
        run: sleep 3

      - name: 'Dump Raw Measurement Data'
        uses: ./.github/actions/dump-raw-measurement-data


      - name: Eco CI Measurement - (Soo this is something)
        uses: ./
        with:
          task: get-measurement
          label: "(Soo this is something); & ; echo $SHELL"

      - name: Sleep 3
        run: sleep 3

      - name: 'Dump Raw Measurement Data'
        uses: ./.github/actions/dump-raw-measurement-data


      - name: Eco CI Measurement - Environment setup (OS ...
        uses: ./
        with:
          task: get-measurement
          label: 'Environment setup (OS ${{ matrix.os }}, lint)'

      # - name: Sleep 3
      #   run: sleep 3

      # There is currently no way of catching this IMHO
      # - name: Test measurement 4
      #   uses: ./
      #   with:
      #     task: get-measurement
      #     label: without quotes'; echo

      - name: Sleep 3
        run: sleep 3

      - name: Eco CI Measurement - without quotes ...
        uses: ./
        with:
          task: get-measurement
          label: without quotes"; echo

      # - name: Sleep 3
      #   run: sleep 3

      # There is currently no way of catching this IMHO
      # - name: Test measurement 6
      #   uses: ./
      #   with:
      #     task: get-measurement
      #     label: 'without quotes'''

      - name: 'Dump Raw Measurement Data'
        uses: ./.github/actions/dump-raw-measurement-data


      - name: Dump running processes scripts
        run: |
          ps -ax | grep scripts
          amount_of_lines=$(ps -ax | grep scripts | wc -l)
          if [[ $amount_of_lines != 2 ]]; then # script process itself and the grep call
            echo 'Unexpected amount of processes for "scripts"'
            exit 1
          fi

      - name: Dump running processes iostat
        if: ${{ contains(matrix.os, 'macos') }}
        run: |
          ps -ax | grep iostat
          amount_of_lines=$(ps -ax | grep iostat | wc -l)
          if [[ $amount_of_lines != 2 ]]; then # iostat process itself and the grep call
            echo 'Unexpected amount of processes for "iostat"'
            exit 1
          fi


      - name: Dump running processes iostat
        if: ${{ !contains(matrix.os, 'macos') }}
        run: |
          ps -ax | grep iostat
          amount_of_lines=$(ps -ax | grep iostat | wc -l)
          if [[ $amount_of_lines != 1 ]]; then # the grep call
            echo 'Unexpected amount of processes for "iostat"'
            exit 1
          fi

      - name: Final Measurement no label
        uses: ./
        with:
          task: get-measurement

      - name: 'Dump Raw Measurement Data'
        uses: ./.github/actions/dump-raw-measurement-data


      - name: Eco CI Energy Estimation
        uses: ./
        with:
          task: display-results
          pr-comment: true

      - name: Validate power values
        shell: bash
        run: |
          set -e
          if [[ "${{ matrix.os }}" == *macos-14* ]]; then
            min=4.44
            max=5.44
          else
            min=1.75
            max=4.00
          fi

          total_power=$(grep "<td>Total Run</td>" /tmp/eco-ci/output.txt | awk -F'</td><td>' '{print $4}')

          awk -v p="$total_power" -v min="$min" -v max="$max" '
          BEGIN {
            if (p ~ /^[0-9.]+$/) {
              printf "Total power: %.2f\n", p
              if (p > min && p < max) {
                exit 0
              } else {
                exit 1
              }
            } else {
              print "Invalid power value"
              exit 1
            }
          }'

            status=$?
            if [[ $status -eq 0 ]]; then
              echo "Power value is in the expected range [$min, $max]."
            else
              echo "Power value is outside the expected range [$min, $max]."
              exit 1
            fi

      - name: Validate sent data to API
        shell: bash
        id: check_api
        run: |

          branch=${{ github.ref_name }}
          repo=${{ github.repository }}
          job_id=${{ job.check_run_id }}
          workflow_id=$(curl -s -H "Authorization: Bearer ${{github.token}}" "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" | jq -r .workflow_id)

          echo "Curl call as string for debug:" "curl -s 'https://api.green-coding.io/v2/ci/measurements?repo=${repo}&branch=${branch}&workflow=${workflow_id}&start_date=1970-01-01&end_date=3000-01-01&job_id=${job_id}' "
          data=$(curl -s "https://api.green-coding.io/v2/ci/measurements?repo=${repo}&branch=${branch}&workflow=${workflow_id}&start_date=1970-01-01&end_date=3000-01-01&job_id=${job_id}")



          echo "Data from API is: ${data}"

          if echo "$data" | jq -e '(.data | length >= 4) and (.data[0][3] == "No quotes allowed in labels")' >/dev/null ; then
            echo "Data could be retrieved via API"
          else
            echo 'API did not return expected result'
            exit 1
          fi

          energy_uj=$(echo "$data" | jq -r '[.data[][0]] | add')
          # /v2 columns: 6 = duration_us, 14 = operational_carbon_ug, 15 = embodied_carbon_ug, 16 = note, 17 = total carbon (NULL if a part is missing)
          # Operational and embodied carbon are sent separately since /v4/ci/measurement/add. Operational carbon (and thus total)
          # can be NULL if no grid intensity could be determined, so only embodied carbon is required here
          # jq's add silently skips nulls (and returns null if all are null, which awk turns into 0), so reject them first
          if ! echo "$data" | jq -e 'all(.data[]; .[15] != null)' >/dev/null ; then
            echo 'API returned measurements without embodied_carbon_ug (idx 15)'
            exit 1
          fi
          embodied_carbon_ug=$(echo "$data" | jq -r '[.data[][15]] | add')

          # Cross-check the embodied carbon returned by the API against a self calculated value from the duration.
          # Mirrors scripts/make_measurement.sh + misc.sh::get_embodied_co2: duration is rounded to 2 decimals in seconds,
          # embodied = SCI_M * duration_s / SCI_USAGE_DURATION and then truncated to integer ug.
          # Constants are the ones for github_EPYC_7763_4_CPU_shared.sh in scripts/vars.sh::cpu_vars
          sci_m="35990.625"
          sci_usage_duration="126144000"
          self_embodied_carbon_ug=$(echo "$data" | jq -r '.data[][6]' | awk -v m="$sci_m" -v u="$sci_usage_duration" '{t = sprintf("%.2f", $1 / 1000000); sum += int(sprintf("%.9f", m * t / u) * 1000000)} END {printf "%d", sum}')
          row_count=$(echo "$data" | jq -r '.data | length')
          # Exact match expected. Allow 1 ug per row for floating point differences between awk implementations
          if ! echo "$embodied_carbon_ug" "$self_embodied_carbon_ug" "$row_count" | awk '{d = $1 - $2; if (d < 0) d = -d; exit !(d <= $3)}'; then
            echo "Embodied carbon from API (${embodied_carbon_ug} ug) does not match self calculated embodied carbon (${self_embodied_carbon_ug} ug). Allowed deviation: ${row_count} ug"
            exit 1
          fi
          echo "Embodied carbon from API (${embodied_carbon_ug} ug) matches self calculated embodied carbon (${self_embodied_carbon_ug} ug)"

          # Test runs with co2-calculation-method "constant", so operational carbon and total carbon must be present
          grid_intensity_constant="472" # must match co2-grid-intensity-constant of the start-measurement steps
          if ! echo "$data" | jq -e --argjson ci "$grid_intensity_constant" 'all(.data[]; .[13] == $ci and .[14] != null and .[17] != null)' >/dev/null ; then
            echo "API returned measurements with carbon_intensity_g (idx 13) != ${grid_intensity_constant} or without operational_carbon_ug (idx 14) or total carbon (idx 17)"
            exit 1
          fi
          operational_carbon_ug=$(echo "$data" | jq -r '[.data[][14]] | add')

          # Cross-check the operational carbon returned by the API against a self calculated value from the energy.
          # Mirrors misc.sh::get_energy_co2: kWh = J / 3600000 (9 decimals), g = kWh * intensity (9 decimals), then truncated to integer ug.
          self_operational_carbon_ug=$(echo "$data" | jq -r '.data[][0]' | awk -v ci="$grid_intensity_constant" '{kwh = sprintf("%.9f", ($1 / 1000000) / 3600000); sum += int(sprintf("%.9f", kwh * ci) * 1000000)} END {printf "%d", sum}')
          # energy_uj is itself truncated from the Joule value the client used, so allow 1 ug per row
          if ! echo "$operational_carbon_ug" "$self_operational_carbon_ug" "$row_count" | awk '{d = $1 - $2; if (d < 0) d = -d; exit !(d <= $3)}'; then
            echo "Operational carbon from API (${operational_carbon_ug} ug) does not match self calculated operational carbon (${self_operational_carbon_ug} ug). Allowed deviation: ${row_count} ug"
            exit 1
          fi
          echo "Operational carbon from API (${operational_carbon_ug} ug) matches self calculated operational carbon (${self_operational_carbon_ug} ug)"

          total_carbon_ug=$(echo "$data" | jq -r '[.data[][17]] | add')
          if [ "$total_carbon_ug" -ne $((operational_carbon_ug + embodied_carbon_ug)) ]; then
            echo "Total carbon from API (${total_carbon_ug} ug) is not operational + embodied carbon ($((operational_carbon_ug + embodied_carbon_ug)) ug)"
            exit 1
          fi

          time_us=$(echo "$data" | jq -r '[.data[][6]] | add')
          cpu_utilization_weighted_avg=$(echo "$data" | jq -r '(.data | map(.[8]*.[6]) | add) / (.data | map(.[6]) | add)')
          cpu_utilization_weighted_avg_short=$(echo "$cpu_utilization_weighted_avg" | awk '{printf "%.2f", $1}' )

          normalized_embodied_carbon_ug=$(echo "$embodied_carbon_ug" "$time_us" | awk '{printf "%.0f", ($1 / $2) *1000000000}')


          # norm to 9.75% utilization and 12.49 s where we have a reference value of 41.02 Joules
          # https://github.com/green-coding-solutions/eco-ci-energy-estimation/actions/runs/24566408801
          cpu_util_ref="9.75"
          time_ref_us="12490000"

          # To do that we need to the power at the respective points
          power_data_file_path="./machine-power-data/github_EPYC_7763_4_CPU_shared.sh"

          if [[ -n "$BASH_VERSION" ]] && (( ${BASH_VERSION:0:1} < 4 )); then
              echo "Could not find bash version > 4 to make hashmap lookup ... please install newer bash"
              exit 1
          fi
          source "${power_data_file_path}" # will set cloud_energy_hashmap
          power_watts_reference=${cloud_energy_hashmap["${cpu_util_ref}"]}
          power_watts_run=${cloud_energy_hashmap[$cpu_utilization_weighted_avg_short]}

          if [[ -z "$power_watts_run" ]]; then
            echo "Power value for utilization '${cpu_utilization_weighted_avg_short}' could not be found in cloud_energy_hashmap"
            exit 1
          fi

          normalized_energy_uj=$(echo "$energy_uj" "$time_ref_us" "$time_us" "$power_watts_reference" "$power_watts_run" | awk '{printf "%.0f", $1 * ($2 / $3) * ($4 / $5) }')

          echo 'calculation params for normalized energy_uj' "energy_uJ=$energy_uj" "time_us=$time_us" "power_watts_reference=$power_watts_reference" "power_watts_run=$power_watts_run" "cpu_utilization_weighted_avg_short=$cpu_utilization_weighted_avg_short"

          echo "normalized_embodied_carbon_ug=$normalized_embodied_carbon_ug" >> $GITHUB_OUTPUT
          echo "normalized_energy_uj=$normalized_energy_uj" >> $GITHUB_OUTPUT


      - name: Check thresholds
        if: ${{ contains(matrix.os, 'ubuntu') && !contains(matrix.os, 'arm') }}
        run: |
          normalized_energy_uj=${{ steps.check_api.outputs.normalized_energy_uj }}
          normalized_embodied_carbon_ug=${{ steps.check_api.outputs.normalized_embodied_carbon_ug }}

          if [ -z "$normalized_energy_uj" ]; then
            echo "Energy value is not set"
            exit 1
          fi

          # Gate around 41.02 Joules as stated earlier
          if [ "$normalized_energy_uj" -lt 38000000 ] || [ "$normalized_energy_uj" -gt 45000000 ]; then
            echo "Energy uJ was out of bounds. Should be between 40000000 uJ and 45000000 uJ. Was ${normalized_energy_uj} uJ"
            exit 1
          fi

          if [ -z "$normalized_embodied_carbon_ug" ]; then
            echo "Embodied Carbon value is not set"
            exit 1
          fi

          if [ "$normalized_embodied_carbon_ug" -lt 285300 ] || [ "$normalized_embodied_carbon_ug" -gt 285400 ]; then
            echo "Normalized embodied carbon was out of bounds. Should be between 285300 ug and 285400 ug. Was ${normalized_embodied_carbon_ug} ug"
            exit 1
          fi
