name: Test Deprecation of old versions

# All tags before v4.5 point to a deprecation commit that only prints a warning.
# This workflow checks that:
#   - deprecated tags still resolve and run without failing the job
#   - they point to the head of the `deprecated` branch (the deprecation commit)
#   - v4.5 (the first supported version) does NOT point to the deprecation commit
#
# It tests published tags, not the code of the current branch, so it does not run on pull requests.
# `uses:` cannot contain expressions, so each tag needs its own step.

on:
  schedule:
    - cron: '44 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated-tags:
    runs-on: ubuntu-latest
    steps:
      - name: v1 (oldest major tag, v1 inputs)
        id: v1
        uses: green-coding-solutions/eco-ci-energy-estimation@v1
        with:
          task: start-measurement
          display-graph: false

      - name: v2
        id: v2
        uses: green-coding-solutions/eco-ci-energy-estimation@v2
        with:
          task: get-measurement
          label: 'deprecation test'

      - name: v3 (v3 inputs)
        id: v3
        uses: green-coding-solutions/eco-ci-energy-estimation@v3
        with:
          task: get-measurement
          label: 'deprecation test'
          company-uuid: ''
          show-carbon: true

      - name: v4.4.1 (last deprecated version)
        id: v4_4_1
        uses: green-coding-solutions/eco-ci-energy-estimation@v4.4.1
        with:
          task: display-results
          send-data: false
          json-output: true

      - name: Check deprecated tags point to the deprecation commit
        run: |
          remote="https://github.com/${GITHUB_REPOSITORY}"
          deprecated_sha=$(git ls-remote "$remote" refs/heads/deprecated | cut -f1)
          if [[ -z "$deprecated_sha" ]]; then
            echo "::error::Branch 'deprecated' not found on ${remote}"
            exit 1
          fi
          echo "Deprecation commit: ${deprecated_sha}"
          failed=0
          for tag in v1 v2 v3 v4.4.1; do
            sha=$(git ls-remote "$remote" "refs/tags/${tag}" | cut -f1)
            if [[ "$sha" != "$deprecated_sha" ]]; then
              echo "::error::${tag} points to '${sha}', not to the deprecation commit"
              failed=1
            else
              echo "${tag}: deprecated"
            fi
          done
          exit $failed

  supported-v4-5:
    runs-on: ubuntu-latest
    steps:
      - name: v4.5 start measurement
        id: v4_5
        uses: green-coding-solutions/eco-ci-energy-estimation@v4.5
        with:
          task: start-measurement
          send-data: false

      - name: Check v4.5 is not deprecated
        run: |
          remote="https://github.com/${GITHUB_REPOSITORY}"
          deprecated_sha=$(git ls-remote "$remote" refs/heads/deprecated | cut -f1)
          sha=$(git ls-remote "$remote" refs/tags/v4.5 | cut -f1)
          if [[ -z "$sha" || "$sha" == "$deprecated_sha" ]]; then
            echo "::error::v4.5 points to '${sha}', but it should still be a working version"
            exit 1
          fi
          echo "v4.5: not deprecated (${sha})"
